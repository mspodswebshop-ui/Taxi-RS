<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assortiment · Idriss Bakkerij</title>
<meta name="description" content="Brood, Marokkaanse specialiteiten, koekjes en taarten van Idriss Bakkerij in Boom.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="assortiment.html">
<div id="site-header"></div>

<main>
  <header class="page-head">
    <div class="wrap">
      <div class="crumbs"><a href="index.html">Home</a> / Assortiment</div>
      <h1>Ons assortiment</h1>
      <p>Van krokant brood tot zoete lekkernijen. Kies wat je wilt en haal het vers af.</p>
    </div>
  </header>

  <section>
    <div class="wrap">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="grid" id="products"></div>
      <p class="note" style="margin-top:22px">Prijzen zijn indicatief. Het aanbod kan per dag verschillen.</p>
    </div>
  </section>

  <section style="padding-top:0">
    <div class="wrap">
      <div class="cta">
        <div>
          <h2>Klaar met kiezen?</h2>
          <p>Bekijk je bestelling en stuur ze via WhatsApp naar de bakkerij.</p>
        </div>
        <a href="bestellen.html" class="btn light">Naar bestellen</a>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>
<script src="app.js"></script>
<script>
  let activeCat = 'Alles';
  try { const c = new URLSearchParams(location.search).get('cat'); if (CATEGORIES.includes(c)) activeCat = c; } catch {}

  function renderTabs() {
    $('#tabs').innerHTML = CATEGORIES.map(c =>
      `<button class="tab" role="tab" aria-selected="${c === activeCat}" data-cat="${c}">${c}</button>`).join('');
    $$('.tab').forEach(b => b.onclick = () => { activeCat = b.dataset.cat; renderTabs(); renderProducts(); });
  }
  function renderProducts() {
    renderGrid($('#products'), PRODUCTS.filter(p => activeCat === 'Alles' || p.cat === activeCat));
  }
  renderTabs(); renderProducts();
</script>
</body>
</html>
