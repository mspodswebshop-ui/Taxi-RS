<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact · Idriss Bakkerij</title>
<meta name="description" content="Adres, openingsuren en contactgegevens van Idriss Bakkerij in Boom.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<meta name="robots" content="noindex, nofollow">
</head>
<body data-page="contact.html">
<div id="site-header"></div>

<main>
  <header class="page-head">
    <div class="wrap">
      <div class="crumbs"><a href="index.html">Home</a> / Contact</div>
      <h1>Contact &amp; openingsuren</h1>
      <p>Kom langs, bel ons of stuur een berichtje via WhatsApp.</p>
    </div>
  </header>

  <section>
    <div class="wrap contact-grid">
      <div class="panel">
        <span class="badge"><span class="dot" data-status-dot></span><span data-status-text></span></span>
        <h2 style="margin-top:16px">Openingsuren</h2>
        <table class="hours" id="hours"></table>
        <h2 style="margin-top:28px">Contact</h2>
        <ul class="contact-list">
          <li><svg><use href="#i-pin"/></svg><span><span data-cfg="street"></span>, <span data-cfg="city"></span></span></li>
          <li><svg><use href="#i-phone"/></svg><a data-tel data-cfg="phoneDisplay"></a></li>
          <li><svg><use href="#i-chat"/></svg><a data-wa target="_blank" rel="noopener">Stuur ons een WhatsApp</a></li>
        </ul>
        <div class="actions" style="margin-top:18px">
          <a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=Blauwstraat+16,+2850+Boom">Routebeschrijving</a>
          <a class="btn whatsapp" data-wa target="_blank" rel="noopener"><svg><use href="#i-chat"/></svg>WhatsApp</a>
        </div>
      </div>
      <div class="map">
        <iframe title="Kaart Idriss Bakkerij" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
          src="https://maps.google.com/maps?q=Blauwstraat%2016%2C%202850%20Boom&z=16&output=embed"></iframe>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>
<script src="app.js"></script>
</body>
</html>
