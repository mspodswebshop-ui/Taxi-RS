<style>
/* Layout: één kolom "schriftpagina's" op ruitjespapier; onderaan (gsm) of bovenaan (breed) een tabbalk. */
:root{
  --paper:#f7f8fb; --grid:#e3e8f2; --sheet:#ffffff; --ink:#1b2a4a; --muted:#5d6a85;
  --line:#d5dbe8; --blue:#2348c8; --blue-soft:#e6ecfd; --mark:#ffe45c; --mark-ink:#3d3300;
  --ok:#14804a; --ok-soft:#e1f5ea; --bad:#c0362c; --bad-soft:#fbe7e5; --coin:#f2b705; --coin-dark:#a87a00;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#111827; --grid:#1a2335; --sheet:#172033; --ink:#e6ebf5; --muted:#9aa6bf;
  --line:#2b3750; --blue:#8aa6ff; --blue-soft:#1f2c4d; --mark:#e8cc3a; --mark-ink:#2a2300;
  --ok:#4cc488; --ok-soft:#173a2a; --bad:#ff7b70; --bad-soft:#3d1f1d; --coin:#f5c52e; --coin-dark:#8a6400; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--f-body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;
  padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 110px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(1.7rem,6vw,2.6rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.4rem;font-weight:800}
h3{font-size:1.08rem;font-weight:600}
.mark{background:linear-gradient(transparent 55%,var(--mark) 55%,var(--mark) 92%,transparent 92%);padding:0 .1em}
.muted{color:var(--muted)}.small{font-size:.875rem}.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{margin:0 0 4px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.8rem;color:var(--muted)}
/* Topbar */
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:14px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:6px;background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;font-weight:700;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.coin{width:22px;height:22px;flex:none;display:inline-block;vertical-align:middle}
.flame{width:22px;height:22px;display:grid;place-items:center;border-radius:50%;background:#ff7a1a;color:#fff;font-size:.75rem;font-family:var(--f-body)}
.lvl{width:22px;height:22px;display:grid;place-items:center;border-radius:50%;background:var(--blue);color:var(--paper);font-size:.72rem}
/* Nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:2px;background:var(--sheet);border-top:2px solid var(--ink);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs a{flex:1 1 0;min-width:0;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:700;font-size:.68rem}
nav.tabs a svg{width:24px;height:24px}
nav.tabs a[aria-current="page"]{color:var(--blue);background:var(--blue-soft)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
/* Basics */
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:12px}
button,.btn{font:inherit;font-weight:700;border-radius:10px;padding:9px 16px;cursor:pointer;border:2px solid var(--ink);background:var(--ink);color:var(--paper);text-decoration:none;display:inline-flex;align-items:center;gap:8px;justify-content:center}
button.ghost{background:transparent;color:var(--ink)}
button.blue{background:var(--blue);border-color:var(--blue);color:#fff}
button.link{border:none;background:none;color:var(--blue);padding:4px 6px}
button:disabled{opacity:.5;cursor:not-allowed}
button:active:not(:disabled){transform:translateY(1px)}
input,select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:.875rem;font-weight:400;border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:4px 12px;border-radius:999px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:4px;background:var(--blue-soft);color:var(--blue)}
.bar{height:10px;background:var(--grid);border-radius:5px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--blue);border-radius:5px;transition:width .3s}
.bar.coin-bar>span{background:var(--coin)}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted)}
/* Home */
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.buddy{position:relative;width:96px;height:96px;border-radius:50%;background:var(--blue-soft);display:grid;place-items:center;font-size:56px;line-height:1;border:3px solid var(--ink);flex:none}
.buddy .acc{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:40px}
.buddy.big{width:140px;height:140px;font-size:84px}.buddy.big .acc{font-size:56px;top:-30px}
.bubble{position:relative;background:var(--sheet);border:2px solid var(--ink);border-radius:14px;padding:12px 14px;min-width:0}
.bubble::before{content:"";position:absolute;left:-10px;top:24px;border:8px solid transparent;border-right-color:var(--ink)}
.quest{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px dashed var(--line)}
.quest:first-of-type{border-top:none}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700}
.check.done{background:var(--ok);border-color:var(--ok);color:#fff}
.reward{display:flex;align-items:center;gap:4px;font-family:var(--f-mono);font-weight:700;font-size:.9rem}
.countdown{font-family:var(--f-mono);font-weight:700;font-size:2.4rem;color:var(--blue);line-height:1}
/* Vak cards */
.vak{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--sheet);color:var(--ink);border:2px solid var(--line);border-radius:var(--r);padding:14px;font-weight:400;align-items:stretch}
.vak:hover{border-color:var(--ink)}
.vak b{font-family:var(--f-display);font-size:1.1rem}
.vak .done{color:var(--ok);font-weight:700}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
/* Quiz */
.opt{display:block;width:100%;text-align:left;background:var(--sheet);color:var(--ink);border:2px solid var(--line);font-weight:400;margin-top:8px;padding:12px 14px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{opacity:1;cursor:default}
.qtext{font-size:1.2rem;margin:0;max-width:65ch;overflow-wrap:anywhere}
.explain{border-left:4px solid var(--mark);padding:8px 12px;margin-top:6px;background:var(--paper);border-radius:0 8px 8px 0}
.cijfer{font-family:var(--f-mono);font-size:3.2rem;font-weight:700;line-height:1}
.cijfer.pass{color:var(--ok)}.cijfer.fail{color:var(--bad)}
.plus{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:40;pointer-events:none;font-family:var(--f-mono);font-weight:700;font-size:1.6rem;color:var(--coin-dark);display:flex;align-items:center;gap:6px;animation:pop 1s ease forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-120%) scale(1)}}
/* Flashcards */
.card-stage{perspective:1200px}
.fcard{position:relative;width:100%;min-height:230px;border:none;padding:0;background:none;color:inherit;transform-style:preserve-3d;transition:transform .45s ease;display:block}
.fcard.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;border:2px solid var(--ink);background:var(--sheet);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:1.2rem;font-weight:400;overflow:auto;overflow-wrap:anywhere}
.face.back{transform:rotateY(180deg);background:var(--blue-soft)}
.face small{position:absolute;top:10px;left:14px;font-size:.72rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.know{background:var(--ok);border-color:var(--ok);color:#fff}.dont{background:var(--bad);border-color:var(--bad);color:#fff}
/* Notes */
.item{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--sheet);min-width:0}
details>summary{cursor:pointer;list-style:none}details>summary::-webkit-details-marker{display:none}
.note-body{max-width:65ch;overflow-wrap:anywhere}.note-body p{margin:.4em 0}.note-body ul{margin:.3em 0;padding-left:1.2em}
.note-body h4{font-family:var(--f-display);margin:.9em 0 .2em;font-size:1rem}
/* Planning */
.exam{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.days{font-family:var(--f-mono);font-weight:700;font-size:1.4rem;min-width:3ch;text-align:right;color:var(--blue)}
.days.soon{color:var(--bad)}
.plan{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:10px}
.day{border:1px solid var(--line);border-radius:var(--r);padding:10px;background:var(--sheet)}
.day.today{border:2px solid var(--blue)}
.day h4{margin:0 0 6px;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.block{display:flex;justify-content:space-between;gap:6px;font-size:.9rem;padding:4px 0;border-top:1px dashed var(--line)}
.block:first-of-type{border-top:none}.block .t{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.block.exam-day{color:var(--bad);font-weight:700}
/* Winkel */
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,140px),1fr));gap:10px}
.ware{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--sheet);border:2px solid var(--line);border-radius:var(--r);padding:12px;text-align:center}
.ware .em{font-size:44px;line-height:1.1}
.ware.on{border-color:var(--blue);background:var(--blue-soft)}
.badge{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet)}
.badge .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--grid);flex:none;filter:grayscale(1);opacity:.5}
.badge.got .ic{background:var(--mark);filter:none;opacity:1}
/* Klas */
.rank{display:grid;grid-template-columns:2.2ch auto 1fr auto;gap:12px;align-items:center;padding:10px 4px;border-top:1px solid var(--line)}
.rank:first-of-type{border-top:none}
.rank.jij{background:var(--blue-soft);border-radius:10px;padding-inline:10px}
.rank .pos{font-family:var(--f-mono);font-weight:700;color:var(--muted);text-align:right}
.mini{position:relative;width:44px;height:44px;border-radius:50%;background:var(--blue-soft);border:2px solid var(--ink);display:grid;place-items:center;font-size:26px;line-height:1}
.mini .acc{position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-size:19px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--grid);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.field label{display:block;font-weight:700;font-size:.9rem;margin-bottom:4px}
.field input{width:100%}
/* Dialog / toast */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,15,30,.55);display:grid;place-items:center;padding:16px}
.dialog{background:var(--sheet);color:var(--ink);border-radius:16px;border:2px solid var(--ink);max-width:440px;width:100%;padding:20px;max-height:90vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:45;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:700;max-width:calc(100% - 32px);text-align:center}
.switch{display:flex;align-items:center;gap:10px;font-weight:700}
.switch input{width:22px;height:22px}
@media (min-width:760px){
  nav.tabs{position:sticky;top:0;bottom:auto;border-top:none;border-bottom:2px solid var(--ink);margin-bottom:14px;background:transparent;padding:0}
  nav.tabs a{flex-direction:row;font-size:.9rem;padding:9px 12px;max-width:none;flex:0 1 auto}
  .wrap{padding-bottom:48px}
  .toast{bottom:24px}
}
@media (prefers-reduced-motion:reduce){.fcard,.bar>span{transition:none}.plus{animation:none;opacity:0}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow">Klas 1Af · examens december</p>
      <h1>Examen <span class="mark">studie</span> 1Af</h1>
    </div>
    <div class="stats" aria-label="Jouw score">
      <span class="stat" title="Momoj"><svg class="coin" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="var(--coin)"/><circle cx="12" cy="12" r="8.2" fill="none" stroke="var(--coin-dark)" stroke-width="1.4"/><text x="12" y="16.2" text-anchor="middle" font-family="Bricolage Grotesque,system-ui,sans-serif" font-weight="800" font-size="11.5" fill="var(--coin-dark)">m</text></svg><span id="sMomoj">0</span></span>
      <span class="stat" title="Dagen op rij gestudeerd"><span class="flame" aria-hidden="true">▲</span><span id="sStreak">0</span></span>
      <span class="stat" title="Niveau"><span class="lvl" id="sLvl">1</span><span id="sXp">0 xp</span></span>
    </div>
  </header>

  <nav class="tabs" aria-label="Onderdelen">
    <a href="#vandaag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Vandaag</span></a>
    <a href="#oefenen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg><span>Oefenen</span></a>
    <a href="#flashcards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg><span>Kaarten</span></a>
    <a href="#leerstof"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5V5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0-2 2z"/><path d="M8 7h8M8 11h6"/></svg><span>Leerstof</span></a>
    <a href="#planning"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg><span>Planning</span></a>
    <a href="#klas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.6"/><path d="M15.5 14.2A5 5 0 0 1 21 19"/></svg><span>Klas</span></a>
    <a href="#winkel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span>Winkel</span></a>
  </nav>

  <main>
    <section id="v-vandaag" class="stack" hidden></section>
    <section id="v-oefenen" class="stack" hidden></section>
    <section id="v-flashcards" class="stack" hidden></section>
    <section id="v-leerstof" class="stack" hidden></section>
    <section id="v-planning" class="stack" hidden></section>
    <section id="v-klas" class="stack" hidden></section>
    <section id="v-winkel" class="stack" hidden></section>
  </main>
</div>
<div id="layer"></div>
<script src="leerstof.js"></script>
<script src="vragen.js"></script>
<script src="app.js"></script>
</body>
</html>
