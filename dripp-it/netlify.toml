# Netlify-configuratie voor de Dripp It-website.
# Zet in Netlify bij "Base directory" de map dripp-it; dan wordt dit bestand gebruikt.
# Er is geen buildstap: de site bestaat uit gewone HTML, CSS en JS.
# De betaalfunctie staat in netlify/functions/checkout.mjs (POST /api/checkout).

[build]
  publish = "."
  command = "echo 'Geen buildstap nodig.'"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
