# Configuratie voor Netlify.
#
# LET OP: je kunt Paylity niet als zip naar Netlify slepen. Dat sleepvak neemt
# kant-en-klare bestanden aan en serveert die; Paylity heeft een dráaiende
# server nodig voor inloggen, betalingen en de API. Koppel daarom je
# Git-repository aan Netlify, dan bouwt Netlify de app zelf.
#
# Dit bestand staat in de map paylity/, niet in de hoofdmap van de repository.
# Zet daarom in Netlify onder Site configuration > Build & deploy >
# Base directory de waarde: paylity
#
# Je hoeft GEEN database te regelen. Omdat @netlify/database in package.json
# staat, zet Netlify bij het uitrollen zelf een PostgreSQL klaar en vult hij
# NETLIFY_DB_URL in. De tabellen komen uit netlify/database/migrations/, die
# Netlify vlak voor het publiceren uitvoert.
#
# Wil je liever je eigen database (Neon, Supabase, of een andere), zet dan
# DATABASE_URL bij Site configuration > Environment variables. Die gaat voor.
#
# Twee variabelen zijn wel het instellen waard:
#
#   NEXT_PUBLIC_APP_URL     het adres van je site, met https://
#   WEBHOOK_SIGNING_SECRET  een eigen geheim
#
# Controleer na het uitrollen https://jouwadres/api/health. Daar staat in
# gewone taal of de database werkt.

[build]
  publish = ".next"

  # Gebruik je een eigen DATABASE_URL, dan draaien de migraties hier. Gebruik je
  # de database van Netlify, dan is die tijdens de build nog niet bereikbaar en
  # slaat deze regel over — Netlify voert netlify/database/migrations/ dan zelf
  # uit vlak voor het publiceren. In beide gevallen gaat de build door: een site
  # die opstart en op /api/health zegt wat er mis is, helpt meer dan een
  # mislukte build met een melding in een logboek.
  command = """
    if [ -n "$DATABASE_URL" ]; then
      npx prisma migrate deploy || echo '!! Migraties mislukt. Zie /api/health na het uitrollen.'
    else
      echo 'Geen eigen DATABASE_URL — Netlify voert de migraties zelf uit.'
    fi
    npm run build
  """

# Deze plug-in laat Next.js écht draaien op Netlify: server-side rendering,
# API-routes en alles wat Paylity nodig heeft. Zonder deze plug-in krijg je
# alleen statische bestanden en werkt inloggen niet.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
