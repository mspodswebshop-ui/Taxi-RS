<!DOCTYPE html>
<html lang="nl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mijn AI</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23d97757'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%23fff'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
  <!-- Zijbalk met gesprekken -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <button class="new-chat" id="newChatBtn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Nieuw gesprek
      </button>
      <button class="icon-btn sidebar-close" id="sidebarCloseBtn" aria-label="Zijbalk sluiten">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <nav class="chat-list" id="chatList" aria-label="Gesprekken"></nav>

    <div class="sidebar-bottom">
      <button class="ghost-btn" id="settingsBtn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
        Instellingen
      </button>
      <button class="ghost-btn" id="themeBtn">
        <svg viewBox="0 0 24 24" aria-hidden="true" id="themeIcon"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <span id="themeLabel">Licht thema</span>
      </button>
    </div>
  </aside>

  <!-- Hoofdvenster -->
  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="sidebarOpenBtn" aria-label="Zijbalk openen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <h1 class="chat-title" id="chatTitle">Nieuw gesprek</h1>
      <span class="model-badge" id="modelBadge"></span>
    </header>

    <div class="messages" id="messages">
      <!-- Welkomstscherm bij een leeg gesprek -->
      <div class="welcome" id="welcome">
        <div class="welcome-logo">✦</div>
        <h2>Waarmee kan ik je helpen?</h2>
        <p class="welcome-sub">Je eigen AI-assistent, aangedreven door de Claude API.</p>
        <div class="suggestions">
          <button class="suggestion" data-prompt="Leg uit hoe een REST API werkt, met een voorbeeld in JavaScript.">
            <strong>Leg iets technisch uit</strong>
            <span>Hoe werkt een REST API?</span>
          </button>
          <button class="suggestion" data-prompt="Schrijf een korte, wervende tekst voor de homepage van een taxibedrijf in Antwerpen.">
            <strong>Schrijf een tekst</strong>
            <span>Wervende homepage-tekst</span>
          </button>
          <button class="suggestion" data-prompt="Help me een bug te vinden. Ik plak hierna mijn code.">
            <strong>Debug mijn code</strong>
            <span>Samen een bug zoeken</span>
          </button>
          <button class="suggestion" data-prompt="Maak een weekplanning voor iemand die 3x per week wil sporten en een fulltime baan heeft.">
            <strong>Maak een plan</strong>
            <span>Weekplanning opstellen</span>
          </button>
        </div>
      </div>
    </div>

    <div class="composer-wrap">
      <form class="composer" id="composer">
        <textarea
          id="input"
          rows="1"
          placeholder="Stel een vraag…  (Enter = versturen, Shift+Enter = nieuwe regel)"
          autocomplete="off"
        ></textarea>
        <button type="submit" class="send-btn" id="sendBtn" aria-label="Versturen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
        <button type="button" class="stop-btn" id="stopBtn" aria-label="Stoppen" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
        </button>
      </form>
      <p class="disclaimer">AI kan fouten maken. Controleer belangrijke informatie.</p>
    </div>
  </main>
</div>

<!-- Instellingen -->
<div class="modal-backdrop" id="settingsModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="modal-head">
      <h2 id="settingsTitle">Instellingen</h2>
      <button class="icon-btn" id="settingsCloseBtn" aria-label="Sluiten">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="modal-body">
      <label class="field">
        <span class="field-label">Model</span>
        <select id="modelSelect"></select>
        <span class="field-hint">Opus is het slimst, Haiku het snelst en goedkoopst.</span>
      </label>

      <label class="field">
        <span class="field-label">Denkkracht</span>
        <select id="effortSelect">
          <option value="low">Laag — snel en goedkoop</option>
          <option value="medium">Gemiddeld</option>
          <option value="high" selected>Hoog (standaard)</option>
          <option value="xhigh">Extra hoog</option>
          <option value="max">Maximaal — voor moeilijke vragen</option>
        </select>
        <span class="field-hint">Hoger = beter nadenken, maar langzamer en duurder.</span>
      </label>

      <label class="field">
        <span class="field-label">Systeemprompt</span>
        <textarea id="systemPrompt" rows="7" placeholder="Beschrijf hoe de assistent zich moet gedragen…"></textarea>
        <span class="field-hint">Bepaalt de persoonlijkheid en regels van jouw assistent.</span>
      </label>

      <label class="check">
        <input type="checkbox" id="showThinking">
        <span>Toon het denkproces van het model</span>
      </label>
    </div>

    <div class="modal-foot">
      <button class="ghost-btn" id="resetPromptBtn">Standaardprompt herstellen</button>
      <button class="primary-btn" id="settingsSaveBtn">Opslaan</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
