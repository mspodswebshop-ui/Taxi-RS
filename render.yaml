# Configuratie voor Render (https://render.com).
#
# Render draait server.js als een gewone, doorlopende Node-server. Daardoor
# geldt er geen tijdslimiet van een paar seconden per verzoek, zoals bij
# serverless functies. Dat is de reden om hiervoor te kiezen als je Fable 5.1
# op hoge denkkracht wilt gebruiken: die antwoorden duren vaak langer dan een
# serverless functie mag draaien.
#
# Gebruik: maak een account op render.com, kies "New > Blueprint" en wijs deze
# repository aan. Vul daarna ANTHROPIC_API_KEY in bij de omgevingsvariabelen.

services:
  - type: web
    name: mijn-ai
    runtime: node
    plan: free
    rootDir: ai-app
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      # sync: false betekent dat Render deze waarde aan jou vraagt en hem niet
      # in dit bestand opslaat. Zet je sleutel dus nooit hieronder.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Alleen nodig als je abonnementen wilt. Laat leeg voor vrije toegang.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      # Het adres dat Render je geeft; Stripe stuurt de klant hierheen terug.
      - key: BASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"

  - type: web
    name: taxi-betaalterminal
    runtime: node
    plan: free
    rootDir: betaal-app
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      # sync: false betekent dat Render deze waarde aan jou vraagt en hem niet
      # in dit bestand opslaat. Zet je sleutel dus nooit hieronder.
      - key: STRIPE_SECRET_KEY
        sync: false
      # Het adres dat Render je geeft; de klant komt hier terug na het betalen.
      - key: BASE_URL
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: NODE_VERSION
        value: "22"

  - type: web
    name: taxi-stempelkaart
    runtime: node
    # Een Disk (om de kaarten te bewaren) kan niet op het gratis plan.
    # Zonder Disk ben je bij elke herstart alle stempels kwijt.
    plan: starter
    rootDir: stempelkaart
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/config
    disk:
      name: stempelkaart-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: BASE_URL
        sync: false
      - key: CHAUFFEUR_PIN
        sync: false
      - key: SESSIE_GEHEIM
        generateValue: true
      - key: BEDRIJF_TELEFOON
        value: "+32 484 90 81 95"
      - key: APPLE_PASS_TYPE_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_WWDR_CERT
        sync: false
      - key: APPLE_SIGNER_CERT
        sync: false
      - key: APPLE_SIGNER_KEY
        sync: false
      - key: APPLE_SIGNER_KEY_PASSPHRASE
        sync: false
      - key: GOOGLE_ISSUER_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT
        sync: false
      - key: NODE_VERSION
        value: "22"
